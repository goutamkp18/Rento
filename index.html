<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/rento-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rento — Find your stay. Manage your space. | Student Accommodation & PG SaaS</title>
    <meta name="description" content="Rento is India's premier student accommodation marketplace and PG management SaaS platform. Discover verified PGs near top colleges and manage properties with ease." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Immediate Theme Initialization Script (Prevents FOUC) -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('rento_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored || (prefersDark ? 'dark' : 'light');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-navy-950 text-slate-100 font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
